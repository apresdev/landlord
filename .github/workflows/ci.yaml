name: build-and-push-docker-to-ecr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: none
  checks: write
  contents: read
  deployments: none
  id-token: write
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: write
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build-and-push:
    timeout-minutes: 10
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26.1' ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Check required AWS configuration
        id: check-aws
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          missing=()
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then missing+=("AWS_ROLE_TO_ASSUME (repository secret)"); fi
          if [ -z "$AWS_REGION" ]; then missing+=("AWS_REGION (repository variable)"); fi
          if [ -z "$ECR_REPOSITORY" ]; then missing+=("ECR_REPOSITORY (repository variable)"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::AWS configuration incomplete — Docker image will not be built or pushed. Missing: ${missing[*]}. See README.md for setup instructions."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build the release target
        run: make setup && make rel

      - name: Configure AWS credentials
        if: steps.check-aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActionsLandlordBuildAndPush
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-aws.outputs.configured == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup QEMU
        if: steps.check-aws.outputs.configured == 'true'
        uses: docker/setup-qemu-action@v2

      - name: Build and tag Docker image
        if: steps.check-aws.outputs.configured == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --platform linux/arm64 .

      - name: Push Docker image to ECR
        if: steps.check-aws.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Tags
        run: |
          echo "GITHUB_REF=$GITHUB_REF"

      - name: Extract Version
        id: version_step
        if: steps.check-aws.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags')
        run: |
          echo "##[set-output name=version_tag;]$ECR_REPOSITORY:${GITHUB_REF#$"refs/tags/v"}"

      - name: Tag with version
        if: steps.check-aws.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags')
        run: |
          echo "version = ${{steps.version_step.outputs.version_tag}}"
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/${{steps.version_step.outputs.version_tag}}
          docker push $ECR_REGISTRY/${{steps.version_step.outputs.version_tag}}
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
