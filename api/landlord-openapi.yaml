openapi: 3.0.3
info:
  title: Landlord Auth API
  version: 1.0.0
  description: The Landlord authentication service. A multi-tenanted usage of AWS Cognito.
  contact:
    email: info@apres.dev
tags:
  - name: Auth
    description: Authentication operations
servers:
  - url: http://localhost:42001
    description: The default testing URL.
    variables: {}
paths:
  /ll-auth/api/login:
    post:
      operationId: Login
      summary: Login with a username and password.
      tags:
        - Auth
      parameters: []
      requestBody:
        $ref: "#/components/requestBodies/LoginRequest"
      description: Initiated a login with a username and password.
      responses:
        "200":
          $ref: '#/components/responses/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      # No security as this is the call to obtain a token
      security: []
  /ll-auth/api/refresh:
    post:
      operationId: Refresh
      summary: Refresh the access token via the refresh token found in a cookie.
      tags:
        - Auth
      requestBody:
        $ref: "#/components/requestBodies/RefreshRequest"
      responses:
        "200":
          $ref: '#/components/responses/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      # No security at the OpenAPI as this is the call to obtain a token. However,
      # the request will only succeed with a valid refresh token.
      security: [ ]
  /ll-auth/api/validate-mfa-code:
    post:
      operationId: ValidateMFACode
      summary: Validate an MFA code.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/ValidateMFACodeRequest"
      description: Validate a one-time multi-factor authentication (MFA) code.
      responses:
        "200":
          $ref: '#/components/responses/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      # No security as this is the call to obtain a token
      security: [ ]
  /ll-auth/api/associate-otp:
    get:
      operationId: AssociateOTP
      summary: Associate OTP with a user.
      tags:
        - Auth
      parameters: [ ]
      description: Begins the process of associating an OTP provider with a user.
      responses:
        "200":
          $ref: '#/components/responses/AssociateOTPResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
    post:
      operationId: VerifyOTPAssociation
      summary: Verify the association of an OTP device.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/VerifyOTPAssociationRequest"
      description: Verify the association of an OTP device.
      responses:
        "204":
          description: No content
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /ll-auth/api/tenants:
    get:
      operationId: GetTenants
      summary: Get a list of tenants.
      tags:
      - Auth
      parameters: []
      description: Get a list of tenants.
      responses:
        "200":
          $ref: '#/components/responses/TenantsResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
    post:
      operationId: CreateTenant
      summary: Create a new tenant
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/CreateTenantRequest"
      responses:
        "200":
          $ref: '#/components/responses/TenantResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: [ ]
  /ll-auth/api/tenants/{tenantID}/state/{tenantState}:
    put:
      operationId: SetTenantState
      summary: Set a tenant's state
      tags:
        - Auth
      parameters:
        - name: tenantID
          in: path
          required: true
          description: The ID of the tenant to get users for.
          schema:
            type: string
        - name: tenantState
          in: path
          required: true
          description: The state to set the tenant to.
          schema:
            type: string
            enum:
              - active
              - inactive
      responses:
        "204":
          description: No content
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: [ ]
  /ll-auth/api/tenants/{tenantID}/users:
    get:
      operationId: GetUsersForTenant
      summary: Get a list of users for a tenant.
      tags:
        - Auth
      parameters:
        - name: tenantID
          in: path
          required: true
          description: The ID of the tenant to get users for.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/TenantUsersResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /ll-auth/api/tenants/{tenantID}/users/{username}:
    put:
      operationId: UpdateUser
      summary: Update a user's settings.
      tags:
        - Auth
      parameters:
        - name: tenantID
          in: path
          required: true
          description: The ID of the tenant to get users for.
          schema:
            type: string
        - name: username
          in: path
          required: true
          description: The username of the user to update.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/UpdateUserRequest"
      responses:
        "204":
          description: No content
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: [ ]
  /ll-auth/api/tenants/{tenantID}/users/{username}/status:
    put:
      operationId: SetUserStatus
      summary: Set a user's status.
      tags:
        - Auth
      parameters:
        - name: tenantID
          in: path
          required: true
          description: The ID of the tenant to get users for.
          schema:
            type: string
        - name: username
          in: path
          required: true
          description: The username of the user to update.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/UpdateUserStatusRequest"
      responses:
        "204":
          description: No content
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: [ ]
  /ll-auth/api/invite:
    post:
      operationId: InviteToTenant
      summary: Invite a user to join a tenant.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/InviteRequest"
      responses:
        "204":
          description: No content
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /ll-auth/api/invite/{username}:
    delete:
      operationId: CancelInvitation
      summary: Cancel an invitation to a tenant.
      tags:
        - Auth
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user to update.
          schema:
            type: string
      responses:
        "204":
          description: No content
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: [ ]
  /ll-auth/api/impersonate-role:
    post:
      operationId: ImpersonateRole
      summary: Impersonate a role within a tenant.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/ImpersonateRoleRequest"
      responses:
        "200":
          $ref: '#/components/responses/ImpersonateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /ll-auth/api/impersonate-user:
    post:
      operationId: ImpersonateUser
      summary: Impersonate a user within a tenant.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/ImpersonateUserRequest"
      responses:
        "200":
          $ref: '#/components/responses/ImpersonateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /ll-auth/api/clear-impersonate:
    post:
      operationId: ClearImpersonate
      summary: Clear any impersonation for the current user.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/ClearImpersonateRequest"
      responses:
        "200":
          $ref: '#/components/responses/ClearImpersonateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /ll-auth/api/new-password:
    post:
      operationId: SetNewPassword
      summary: Set a new password after being issued a temporary password.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/SetNewPasswordRequest"
      responses:
        "200":
          $ref: '#/components/responses/SetNewPasswordResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      # No security on this as the request is authenticated via a one-time
      # session parameter that is included in the request.
      security: []
  /ll-auth/api/recover-password:
    post:
      operationId: RecoverPassword
      summary: Recover a password.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/RecoverPasswordRequest"
      responses:
        "200":
          $ref: '#/components/responses/RecoverPasswordResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      # No security on this as it initiates a password recovery, and, by
      # definition the user does not have a password.
      security: []
  /ll-auth/api/reset-password:
    post:
      operationId: ResetPassword
      summary: Reset a password.
      tags:
        - Auth
      parameters: [ ]
      requestBody:
        $ref: "#/components/requestBodies/ResetPasswordRequest"
      responses:
        "204":
          description: No content
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      # No security as this is authorized with a one-time confirmation code
      security: []

components:
  parameters: {}
  requestBodies:
    LoginRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    RefreshRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshRequest'
    ValidateMFACodeRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidateMFACodeRequest'
    VerifyOTPAssociationRequest:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPAssociationRequest'
    ImpersonateRoleRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImpersonateRoleRequest'
    ImpersonateUserRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImpersonateUserRequest'
    ClearImpersonateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClearImpersonateRequest'
    SetNewPasswordRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetNewPasswordRequest'
    RecoverPasswordRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoverPasswordRequest'
    ResetPasswordRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResetPasswordRequest'
    InviteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteRequest'
    CreateTenantRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTenantRequest'
    UpdateUserRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserRequest'
    UpdateUserStatusRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserStatusRequest'
  responses:
    NoContent:
      description: |
        The request completed successfully.  No response body will be sent.
    LoginResponse:
      description: A response for a successful authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'
    AssociateOTPResponse:
      description: Return the secret for associating an OTP device.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssociateOTPResponse'
    TenantResponse:
      description: A single tenant response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantResponse'
    TenantsResponse:
      description: Return the tenants available to the user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantsResponse'
    TenantUsersResponse:
      description: Return the users associated with the tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantUsersResponse'
    ImpersonateResponse:
      description: Return a new token for the impersonated role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImpersonateResponse'
    ClearImpersonateResponse:
      description: Clear any impersonation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClearImpersonateResponse'
    RecoverPasswordResponse:
      description: A response for a successful initiation of a password recovery
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoverPasswordResponse'
    SetNewPasswordResponse:
      description: A response for a successful setting of a new password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetNewPasswordResponse'
    BadRequest:
      description: An error occurred.  The client provided one or more invalid inputs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            status: failure
            data:
              errors:
                - message: bad_request
                  description: The supplied value was invalid.
                  path: request
    Unauthorized:
      description: An error occurred.  The client is not authenticated in the system.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            status: failure
            data:
              errors:
                - message: unauthorized
                  description: The client should authenticate itself to get the requested response.
    Forbidden:
      description: An error occurred.  The client is not authorized to perform the requested action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            status: failure
            data:
              errors:
                - message: forbidden
                  description: The client does not have the access right for the content.
    NotFound:
      description: An error occurred.  The client requested a resource that does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            status: failure
            data:
              errors:
                - message: not_found
                  description: Could not find to requested resource.
    InternalServerError:
      description: An unexpected error occurred during the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            status: failure
            data:
              errors:
                - message: server_error
                  description: An error occurred while processing the request.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    oauth2:
      type: oauth2
      description: This API uses OAuth 2 with the implicit grant flow. [More info](https://api.example.com/docs/auth)
      flows:
        authorizationCode:
          authorizationUrl: /authorize
          tokenUrl: /token
          scopes: {}
    cognito:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - ${cognito_provider_arn}
  schemas:
    APIStatus:
      type: string
      enum:
        - success
        - failure
      x-enum-varnames:
        - APIStatusSuccess
        - APIStatusFailure
    FieldError:
      type: object
      properties:
        message:
          type: string
        description:
          type: string
        path:
          type: string
    APIError:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/APIStatus'
        data:
          type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    LoginStatus:
      type: string
      enum:
        - success
        - new-password-required
        - password-reset-required
        - mfa-setup-required
        - mfa-code-required
      x-enum-varnames:
        - LoginStatusSuccess
        - LoginStatusNewPasswordRequired
        - LoginStatusPasswordResetRequired
        - LoginStatusMFASetupRequired
        - LoginStatusMFACodeRequired
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required:
        - status
        - session
        - idToken
        - accessToken
        - refreshToken
        - optURI
      properties:
        status:
          $ref: '#/components/schemas/LoginStatus'
        session:
          type: string
        idToken:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        otpURI:
          type: string
    RefreshRequest:
      type: object
      required:
        - username
        - refreshToken
      properties:
        username:
          type: string
        refreshToken:
          type: string
    SetNewPasswordResponse:
      type: object
      required:
        - status
        - idToken
        - accessToken
        - refreshToken
        - otpURI
      properties:
        status:
          $ref: '#/components/schemas/LoginStatus'
        idToken:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        otpURI:
          type: string
    AssociateOTPResponse:
      type: object
      required:
        - otpURI
      properties:
        otpURI:
          type: string
    ValidateMFACodeRequest:
      type: object
      required:
        - username
        - mfaCode
        - session
      properties:
        username:
          type: string
        mfaCode:
          type: string
        session:
          type: string
    VerifyOTPAssociationRequest:
      type: object
      required:
        - username
        - otpCode
        - accessToken
      properties:
        username:
          type: string
        otpCode:
          type: string
        accessToken:
          type: string
    Tenant:
      type: object
      required:
        - id
        - name
        - description
        - roles
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            type: string
    TenantResponse:
      type: object
      required:
        - tenant
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
    TenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
    TenantUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            required:
              - username
              - role
              - status
              - cognitoID
            properties:
              username:
                type: string
              role:
                type: string
              status:
                type: string
                enum:
                  - inactive
                  - invited
                  - active
              cognitoID:
                type: string
    ImpersonateRoleRequest:
      type: object
      required:
        - tenant
        - role
        - refreshToken
      properties:
        tenant:
          type: string
        role:
          type: string
        refreshToken:
          type: string
    ImpersonateUserRequest:
      type: object
      required:
        - tenant
        - username
        - refreshToken
      properties:
        tenant:
          type: string
        username:
          type: string
          format: uuid
        refreshToken:
          type: string
    ImpersonateResponse:
      type: object
      required:
        - idToken
        - accessToken
      properties:
        idToken:
          type: string
        accessToken:
          type: string
    ClearImpersonateRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    ClearImpersonateResponse:
      type: object
      required:
        - idToken
        - accessToken
      properties:
        idToken:
          type: string
        accessToken:
          type: string
    SetNewPasswordRequest:
      type: object
      required:
        - username
        - password
        - session
      properties:
        username:
          type: string
        password:
          type: string
        session:
          type: string
    ResetPasswordRequest:
      type: object
      required:
        - username
        - confirmationCode
        - newPassword
      properties:
        username:
